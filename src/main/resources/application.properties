spring.application.name=portifolio-projetos-api
spring.jpa.hibernate.ddl-auto=validate

#conexao db
spring.datasource.url=jdbc:postgresql://localhost:5432/spring_boot_api
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

#seguranca
app.security.user=${APP_USER:admin}
app.security.password=${APP_PASSWORD:admin123}

#api membros url
app.membros.api.url=http://localhost:8080/api-externa/membros